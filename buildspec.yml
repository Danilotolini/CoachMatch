version: 0.2

phases:
  pre_build:
    commands:
      - echo "Installing Node.js v20..."
      - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      - apt-get install -y nodejs
      - echo "Installing pnpm@10..."
      - npm install -g pnpm@10
      - echo "Installing dependencies..."
      - cd client
      - pnpm install --frozen-lockfile
  
  build:
    commands:
      - echo "Running unit tests..."
      - pnpm run test -- payment.integration.test.ts --coverage || true
      - echo "Type checking..."
      - pnpm run type-check || true
      - echo "Linting..."
      - pnpm run lint || true
      - echo "Building..."
      - pnpm run build || true

  post_build:
    commands:
      - echo "Tests complete"

artifacts:
  files:
    - 'client/dist/**/*'
    - 'client/coverage/**/*'
  name: PaymentBuild

cache:
  paths:
    - '/root/.pnpm-store/**/*'
    - '/root/.cache/**/*'
