components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "IdToken emitido pelo Amazon Cognito (papel ativo: aluno ou treinador)."

  responses:
    Unauthorized:
      description: Token ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Payload inválido (JSON malformado ou campo obrigatório ausente).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Autenticado, mas sem permissão sobre o recurso (ownership).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: |
        Regra de negócio violada (datas inválidas, conflito de horário, gym/especialidade
        inexistente, estado incompatível, janela de cancelamento, etc.).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  parameters:
    ChatChannelId:
      in: path
      name: id
      required: true
      description: Id do canal (conversa), ex. `dm_1a2b3c4d_5e6f7a8b`.
      schema: { type: string }
    ChatMessageId:
      in: path
      name: id
      required: true
      description: Id da mensagem no Stream.
      schema: { type: string }
    ChatLimit:
      in: query
      name: limit
      required: false
      description: Número máximo de itens (padrão 30).
      schema: { type: integer, default: 30 }
    ChatBefore:
      in: query
      name: before
      required: false
      description: Id da mensagem usada como cursor — retorna apenas mensagens anteriores a ela.
      schema: { type: string }

  schemas:
    Error:
      type: object
      properties:
        errors:
          type: array
          items: { type: string }
          example: ["Missing required field: scheduleId."]
      required: [errors]

    Coordinates:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double, example: -23.561414 }
        lng: { type: number, format: double, example: -46.655881 }

    Pagination:
      type: object
      required: [page, limit, total, totalPages, hasNext, hasPrev]
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 12 }
        total: { type: integer, example: 42 }
        totalPages: { type: integer, example: 4 }
        hasNext: { type: boolean }
        hasPrev: { type: boolean }

    PaginatedEnvelope:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: {}
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Client / Student ──────────────────────
    ClientStatus:
      type: string
      enum: [PENDING_PROFILE, ONBOARDING_HEALTH, ACTIVE]

    ClientGender:
      type: string
      enum: [F, M, NB, NA]

    ClientGoal:
      type: string
      enum: [WEIGHT_LOSS, HYPERTROPHY, CONDITIONING, REHAB, PERFORMANCE]

    ClientHealth:
      type: object
      required: [answers, lgpdConsent, medicalDisclaimer]
      properties:
        answers:
          type: object
          description: Mapa das respostas PAR-Q — chaves fixas heart/chest_pain/dizziness/bone_joint/medication.
          additionalProperties:
            type: string
            enum: [YES, NO]
        notes:
          type: string
          description: Observações livres sobre restrições ou lesões.
        lgpdConsent: { type: boolean }
        medicalDisclaimer: { type: boolean }

    Client:
      type: object
      required: [clientId, email, status, createdAt, updatedAt]
      properties:
        clientId: { type: string, example: client_demo }
        email: { type: string, format: email }
        status: { $ref: "#/components/schemas/ClientStatus" }
        name: { type: string, nullable: true }
        phone: { type: string, nullable: true, example: "+5511999990000" }
        birthDate: { type: string, format: date, nullable: true }
        gender:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ClientGender"
        cep: { type: string, nullable: true, example: "01310-100" }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true, minLength: 2, maxLength: 2 }
        radius: { type: integer, nullable: true, description: Raio em km. }
        goal:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ClientGoal"
        health:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ClientHealth"
        photo_url:
          type: string
          nullable: true
          description: URL pré-assinada (GET) da foto de perfil. null quando não há foto.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CoachStudentDetail:
      type: object
      required: [studentId]
      description: >
        Recorte de um aluno visível ao treinador na sessão — sem dados de contato.
      properties:
        studentId: { type: string }
        name: { type: string, nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        gender:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ClientGender"
        goal:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ClientGoal"
        health:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ClientHealth"

    ClientProfilePayload:
      type: object
      required: [name, phone, birthDate, gender, cep, city, state, radius, goal]
      properties:
        name: { type: string }
        phone: { type: string, example: "+5511999990000" }
        birthDate: { type: string, format: date }
        gender:
          type: string
          enum: [F, M, NB, NA]
        cep: { type: string, example: "01310-100" }
        city: { type: string, example: São Paulo }
        state: { type: string, minLength: 2, maxLength: 2, example: SP }
        radius:
          type: integer
          minimum: 1
          maximum: 100
          description: Raio de atendimento em km (1 a 100).
        goal:
          type: string
          enum: [WEIGHT_LOSS, HYPERTROPHY, CONDITIONING, REHAB, PERFORMANCE]
        photo_key:
          type: string
          nullable: true
          description: >
            Key do S3 da foto (retornada por POST /student/upload-url). Omitir mantém a
            foto atual; null/"" remove.
          example: "uploads/3f2a-foto.jpg"

    ClientHealthPayload:
      type: object
      required: [answers, lgpdConsent, medicalDisclaimer]
      properties:
        answers:
          type: object
          required: [heart, chest_pain, dizziness, bone_joint, medication]
          description: >
            Respostas do PAR-Q. Exatamente estas 5 perguntas, cada uma "YES" ou "NO".
          properties:
            heart: { type: string, enum: ["YES", "NO"] }
            chest_pain: { type: string, enum: ["YES", "NO"] }
            dizziness: { type: string, enum: ["YES", "NO"] }
            bone_joint: { type: string, enum: ["YES", "NO"] }
            medication: { type: string, enum: ["YES", "NO"] }
        notes:
          type: string
          description: Observações livres do aluno.
        lgpdConsent:
          type: boolean
          enum: [true]
          description: Consentimento LGPD obrigatório; deve ser true.
        medicalDisclaimer:
          type: boolean
          enum: [true]
          description: Aceite do disclaimer médico obrigatório; deve ser true.

    # ── Coach ─────────────────────────────────
    CoachStatus:
      type: string
      description: >
        Status público do treinador. Coaches recém-cadastrados ficam em
        PENDING_PROFILE até completar o perfil; após salvar o perfil, ficam
        ativos imediatamente como APPROVED.
      enum: [PENDING_PROFILE, APPROVED]

    CoachVisibility:
      type: string
      enum: [VISIBLE, INVISIBLE]

    CoachProfile:
      type: object
      required: [name, phone, specialties, cref, instagram, photo_url, video_url]
      properties:
        name: { type: string }
        phone:
          type: string
          nullable: true
        specialties:
          type: array
          items: { type: string }
        cref: { type: string, example: "012345-G/SP" }
        instagram: { type: string, example: "@treinador" }
        photo_url:
          type: string
          nullable: true
          description: >
            URL pré-assinada (GET) da foto de perfil no bucket privado. null quando não há
            foto. Gerada na leitura a partir da `photo_key` persistida; expira (SIGNED_URL_EXPIRES).
        video_url:
          type: string
          nullable: true
          description: >
            URL pré-assinada (GET) do vídeo de apresentação. null quando não há vídeo.

    CoachProfileUpdate:
      type: object
      required: [name, phone, specialties, cref]
      description: >
        Perfil enviado em PUT /coach/me. As mídias são as KEYS do S3
        (`photo_key`/`video_key`) retornadas por POST /coach/upload-url — a leitura é que
        assina e devolve `photo_url`/`video_url`. Omitir uma key mantém a mídia atual;
        enviar null/"" a remove.
      properties:
        name: { type: string }
        phone: { type: string }
        specialties:
          type: array
          items: { type: string }
          minItems: 1
        cref: { type: string, example: "012345-G/SP" }
        instagram: { type: string, default: "", example: "@treinador" }
        photo_key:
          type: string
          nullable: true
          example: "uploads/3f2a-foto.jpg"
        video_key:
          type: string
          nullable: true
          example: "uploads/9b1c-video.mp4"

    WorkLocation:
      oneOf:
        - $ref: "#/components/schemas/WorkLocationGym"
        - $ref: "#/components/schemas/WorkLocationHomeService"
      discriminator:
        propertyName: type
        mapping:
          GYM: "#/components/schemas/WorkLocationGym"
          HOME_SERVICE: "#/components/schemas/WorkLocationHomeService"

    WorkLocationGym:
      type: object
      required: [type, gymId]
      properties:
        type:
          type: string
          enum: [GYM]
        gymId: { type: string }

    WorkLocationHomeService:
      type: object
      required: [type, coverage]
      properties:
        type:
          type: string
          enum: [HOME_SERVICE]
        coverage:
          type: object
          required: [city, state]
          properties:
            city: { type: string, example: São Paulo }
            state: { type: string, minLength: 2, maxLength: 2, example: SP }
            neighborhoods:
              type: array
              items: { type: string }
              description: Bairros atendidos. Ausente vira lista vazia.

    Coach:
      type: object
      required:
        [
          coachId,
          email,
          status,
          visibility,
          profile,
          work_location,
          createdAt,
          updatedAt,
        ]
      properties:
        coachId: { type: string }
        email: { type: string, format: email }
        status: { $ref: "#/components/schemas/CoachStatus" }
        visibility: { $ref: "#/components/schemas/CoachVisibility" }
        profile: { $ref: "#/components/schemas/CoachProfile" }
        work_location:
          type: array
          items:
            $ref: "#/components/schemas/WorkLocation"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CoachUpdatePayload:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/CoachProfileUpdate"
        work_location:
          type: array
          items:
            $ref: "#/components/schemas/WorkLocation"

    CoachSummaryProfile:
      type: object
      required: [name, phone, specialties, cref, instagram, photo_url, video_url]
      properties:
        name: { type: string }
        phone: { type: string, nullable: true }
        specialties:
          type: array
          items: { type: string }
        cref: { type: string, nullable: true, example: "012345-G/SP" }
        instagram: { type: string, nullable: true, example: "@treinador" }
        photo_url:
          type: string
          nullable: true
          description: URL pré-assinada (GET) da foto de perfil. null quando não há foto.
        video_url:
          type: string
          nullable: true
          description: URL pré-assinada (GET) do vídeo de apresentação. null quando não há vídeo.

    CoachSummary:
      type: object
      required: [coachId, profile, work_location]
      properties:
        coachId: { type: string }
        profile: { $ref: "#/components/schemas/CoachSummaryProfile" }
        work_location:
          type: array
          items:
            $ref: "#/components/schemas/WorkLocation"

    CoachSearchCursor:
      type: object
      required: [coachId]
      properties:
        coachId: { type: string }

    CoachSearchResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CoachSummary"
        meta:
          type: object
          required: [limit, lastKey]
          properties:
            limit: { type: integer }
            lastKey:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/CoachSearchCursor"

    CoachDetailGym:
      type: object
      required: [name, neighborhood, city, state]
      properties:
        name: { type: string, nullable: true }
        neighborhood: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }

    CoachDetailGymLocation:
      type: object
      required: [type, gymId, gym]
      properties:
        type:
          type: string
          enum: [GYM]
        gymId: { type: string, nullable: true }
        gym:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CoachDetailGym"

    CoachDetailHomeLocation:
      type: object
      required: [type, coverage]
      properties:
        type:
          type: string
          enum: [HOME_SERVICE]
        coverage:
          type: object
          required: [city, state, neighborhoods]
          properties:
            city: { type: string, nullable: true }
            state: { type: string, nullable: true }
            neighborhoods:
              type: array
              items: { type: string }

    CoachDetailWorkLocation:
      oneOf:
        - $ref: "#/components/schemas/CoachDetailGymLocation"
        - $ref: "#/components/schemas/CoachDetailHomeLocation"
      discriminator:
        propertyName: type

    CoachDetail:
      type: object
      description: >
        Detalhe público de um treinador. Traz o máximo de dados não sensíveis
        (o e-mail e dados de conta ficam de fora). As localidades do tipo GYM
        vêm enriquecidas com os dados da academia.
      required: [coachId, status, profile, work_location]
      properties:
        coachId: { type: string }
        status: { $ref: "#/components/schemas/CoachStatus" }
        profile: { $ref: "#/components/schemas/CoachSummaryProfile" }
        work_location:
          type: array
          items:
            $ref: "#/components/schemas/CoachDetailWorkLocation"

    # ── Gym ───────────────────────────────────
    Gym:
      type: object
      required: [id, name, active, address, city, state, neighborhood, coordinates]
      properties:
        id: { type: string, example: gym_sp005 }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string, minLength: 2, maxLength: 2 }
        neighborhood: { type: string }
        active:
          type: string
          enum: ["True", "False"]
        coordinates:
          $ref: "#/components/schemas/Coordinates"

    GymSuggestPayload:
      type: object
      required: [name, address, city, state, neighborhood, coordinates]
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string, minLength: 2, maxLength: 2 }
        neighborhood: { type: string }
        coordinates:
          $ref: "#/components/schemas/Coordinates"

    GymSuggestResponse:
      type: object
      required: [data, message]
      properties:
        data: { $ref: "#/components/schemas/Gym" }
        message:
          type: string
          example: Sugestão registrada com sucesso. Aguardando aprovação.

    # ── Specialty ─────────────────────────────
    Specialty:
      type: object
      required: [id, label]
      properties:
        id: { type: string, example: musculacao }
        label: { type: string, example: Musculação }

    # ── Schedule ──────────────────────────────
    # Status no nível da disponibilidade (item da tabela `schedule`).
    ScheduleStatus:
      type: string
      enum: [AVAILABLE, REQUESTED, BOOKED, CANCELLED, COMPLETED, NOSHOW]

    # Status de cada solicitação dentro do array `requests` de um schedule.
    RequestStatus:
      type: string
      enum: [REQUESTED, APPROVED, REJECTED]

    ClassStatus:
      type: string
      enum: [COMPLETED, NOSHOW]

    Schedule:
      type: object
      required:
        [
          scheduleId,
          coachId,
          gymId,
          specialtyId,
          startDateTime,
          endDateTime,
          price,
          status,
        ]
      properties:
        scheduleId:
          { type: string, example: avl_6cb2b644248448c68e63f350119c032d }
        coachId: { type: string }
        gymId: { type: string, example: gym_sp005 }
        specialtyId: { type: string, example: MUSCULATION }
        startDateTime:
          {
            type: string,
            format: date-time,
            example: "2026-06-03T07:30:00-03:00",
          }
        endDateTime:
          {
            type: string,
            format: date-time,
            example: "2026-06-03T08:00:30-03:00",
          }
        price:
          type: string
          description: Valor em BRL.
          example: "120.00"
        status: { $ref: "#/components/schemas/ScheduleStatus" }
        studentId:
          type: string
          nullable: true
          description: Aluno com a reserva confirmada (presente quando status = BOOKED).
          example: 037c4a8a-6031-705c-e02f-8e45f93bd387
        requests:
          type: array
          nullable: true
          description: Solicitações de agendamento associadas (presente em consultas do treinador).
          items:
            $ref: "#/components/schemas/ScheduleRequest"
        paymentStatus:
          type: string
          nullable: true
        rating:
          type: number
          nullable: true
        studentComment:
          type: string
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ScheduleCreatePayload:
      type: object
      required: [gymId, specialtyId, startDateTime, endDateTime, price]
      properties:
        gymId: { type: string, example: gym_sp005 }
        specialtyId: { type: string, example: MUSCULATION }
        startDateTime:
          {
            type: string,
            format: date-time,
            example: "2026-06-03T07:30:00-03:00",
          }
        endDateTime:
          {
            type: string,
            format: date-time,
            example: "2026-06-03T08:00:30-03:00",
          }
        price:
          type: string
          description: Valor em BRL.
          example: "120.00"

    ScheduleRequest:
      type: object
      required: [studentId, status, requestedAt]
      properties:
        studentId:
          { type: string, example: 037c4a8a-6031-705c-e02f-8e45f93bd387 }
        status: { $ref: "#/components/schemas/RequestStatus" }
        requestedAt: { type: string, format: date-time }
        alteredAt:
          type: string
          format: date-time
          nullable: true
          description: Preenchido quando a solicitação é aprovada ou rejeitada.
        studentName:
          type: string
          nullable: true
          description: Nome do aluno, incluído ao listar solicitações de um schedule.

    # Resposta de GET disponibilidades por academia (get-gym-schedule).
    GymScheduleResponse:
      type: object
      required: [gymId, startDateTime, endDateTime, count, schedules]
      properties:
        gymId: { type: string, example: gym_sp005 }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
        count: { type: integer, example: 3 }
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"

    # Resposta de GET agenda do treinador autenticado (get-coach-schedule-from-jwt).
    CoachScheduleResponse:
      type: object
      required: [coachId, startDateTime, endDateTime, count, schedules]
      properties:
        coachId: { type: string }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
        count: { type: integer, example: 3 }
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"

    # Item reduzido devolvido ao aluno ao consultar a agenda de um treinador.
    CoachScheduleSlot:
      type: object
      required:
        [scheduleId, coachId, gymId, specialtyId, startDateTime, endDateTime, price, status]
      properties:
        scheduleId: { type: string, example: avl_6cb2b644248448c68e63f350119c032d }
        coachId: { type: string }
        gymId: { type: string, example: gym_sp005 }
        specialtyId: { type: string, example: MUSCULATION }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
        price: { type: string, example: "120.00" }
        status: { $ref: "#/components/schemas/ScheduleStatus" }

    # Resposta de GET agenda de um treinador para o aluno (get-coach-schedule-from-parm).
    StudentCoachSchedulesResponse:
      type: object
      required: [coachId, startDateTime, endDateTime, count, schedules]
      properties:
        coachId: { type: string }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
        count: { type: integer, example: 3 }
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/CoachScheduleSlot"

    # Resposta de GET solicitações de um schedule (get-schedule-requests).
    ScheduleRequestsResponse:
      type: object
      required: [scheduleId, count, requests]
      properties:
        scheduleId:
          { type: string, example: avl_6cb2b644248448c68e63f350119c032d }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/ScheduleStatus" }
        count: { type: integer, example: 2 }
        requests:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleRequest"

    # Resposta de criação de solicitação de agendamento (post-schedule-request).
    ScheduleRequestResult:
      type: object
      required: [message, scheduleId, studentId, status, requestedAt]
      properties:
        message: { type: string, example: Schedule request submitted successfully. }
        scheduleId:
          { type: string, example: avl_6cb2b644248448c68e63f350119c032d }
        studentId:
          { type: string, example: 037c4a8a-6031-705c-e02f-8e45f93bd387 }
        status: { $ref: "#/components/schemas/RequestStatus" }
        requestedAt: { type: string, format: date-time }

    # Resposta de aprovação de agendamento (post-approve-schedule).
    ScheduleApproveResult:
      type: object
      required: [message, scheduleId, studentId, status, updatedAt]
      properties:
        message: { type: string, example: Schedule approved successfully. }
        scheduleId:
          { type: string, example: avl_6cb2b644248448c68e63f350119c032d }
        studentId:
          { type: string, example: 037c4a8a-6031-705c-e02f-8e45f93bd387 }
        status:
          type: string
          enum: [BOOKED]
        updatedAt: { type: string, format: date-time }

    # Resposta de cancelamento de schedule (coach e aluno).
    ScheduleCancelResult:
      type: object
      required: [message, scheduleId, status, cancelledAt]
      properties:
        message: { type: string, example: Schedule cancelled successfully. }
        scheduleId:
          { type: string, example: avl_6cb2b644248448c68e63f350119c032d }
        status:
          type: string
          enum: [CANCELLED]
        notifiedStudents:
          type: integer
          description: Presente apenas no cancelamento pelo treinador.
          example: 1
        cancelledAt: { type: string, format: date-time }

    # Resposta de GET /student/coach/schedules/request (get-student-requests-by-JWT).
    StudentScheduleItem:
      type: object
      required: [scheduleId, coachId, gymId, specialtyId, price, startDateTime, endDateTime, scheduleStatus]
      properties:
        scheduleId: { type: string, example: avl_6cb2b644248448c68e63f350119c032d }
        coachId: { type: string }
        gymId: { type: string, example: gym_sp005 }
        specialtyId: { type: string, example: MUSCULATION }
        price: { type: string, example: "120.00" }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
        scheduleStatus: { $ref: "#/components/schemas/ScheduleStatus" }
        paymentStatus:
          type: string
          nullable: true
          description: Status do pagamento. `null` enquanto não pago; `PAID` após confirmação.
          example: PAID
        paymentTransactionId:
          type: string
          nullable: true
          description: Id da transação que pagou o schedule (presente quando `paymentStatus = PAID`).
        request:
          nullable: true
          description: Solicitação do aluno autenticado para este schedule.
          allOf:
            - $ref: "#/components/schemas/ScheduleRequest"

    StudentSchedulesResponse:
      type: object
      required: [studentId, count, schedules]
      properties:
        studentId: { type: string }
        count: { type: integer }
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/StudentScheduleItem"

    # Resposta de DELETE /student/coach/schedules/request (cancel-student-request).
    CancelRequestResult:
      type: object
      required: [message, scheduleId, studentId, scheduleStatus, cancelledAt]
      properties:
        message: { type: string, example: Request cancelled successfully. }
        scheduleId: { type: string, example: avl_6cb2b644248448c68e63f350119c032d }
        studentId: { type: string, example: 037c4a8a-6031-705c-e02f-8e45f93bd387 }
        scheduleStatus:
          $ref: "#/components/schemas/ScheduleStatus"
          description: Status do schedule após o cancelamento (AVAILABLE ou REQUESTED).
        cancelledAt: { type: string, format: date-time }

    # Resposta de POST /coach/schedule/class/status (post-class-status).
    ClassStatusResult:
      type: object
      required: [message, scheduleId, status, paymentStatus, updatedAt]
      properties:
        message: { type: string, example: "Schedule updated to 'COMPLETED' successfully." }
        scheduleId: { type: string, example: avl_6cb2b644248448c68e63f350119c032d }
        status: { $ref: "#/components/schemas/ClassStatus" }
        paymentStatus:
          type: string
          enum: [PENDING]
          description: Sempre PENDING após a conclusão — aguardando processamento de pagamento.
        updatedAt: { type: string, format: date-time }

    # ── Pagamentos ────────────────────────────
    PaymentSplit:
      type: object
      description: Divisão do valor entre a plataforma e o treinador.
      properties:
        platform: { type: integer, description: Valor da plataforma em centavos. }
        coach: { type: integer, description: Valor do treinador em centavos. }

    TransactionStatus:
      type: string
      enum: [approved, refused, refunded]

    Transaction:
      type: object
      required: [transactionId, sessionId, coachId, studentId, method, amount, status, createdAt]
      properties:
        transactionId: { type: string, example: mock_uuid }
        sessionId: { type: string, format: uuid }
        coachId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        method:
          type: string
          enum: [credit_card, pix]
        amount:
          type: integer
          description: Valor em centavos.
          example: 12000
        status: { $ref: "#/components/schemas/TransactionStatus" }
        split:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PaymentSplit"
        cardLastFour:
          type: string
          nullable: true
          example: "4321"
        refusalReason: { type: string, nullable: true }
        requires3ds: { type: boolean, nullable: true }
        pixCode: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        refundId: { type: string, nullable: true }
        refundedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    CardPaymentPayload:
      type: object
      # studentId não vai no body: é derivado do JWT (claim sub) e ignorado se enviado.
      required: [sessionId, coachId, amount, method, card]
      properties:
        sessionId: { type: string, minLength: 1, maxLength: 128, description: "Referência opaca ao recurso pago (ex.: scheduleId). Não é UUID." }
        coachId: { type: string, format: uuid }
        amount:
          type: integer
          description: Valor em centavos (mínimo 100 = R$ 1,00).
          minimum: 100
        method:
          type: string
          enum: [credit_card]
        card:
          type: object
          required: [number, holder, expiryMonth, expiryYear, cvv]
          properties:
            number: { type: string, description: "16 dígitos, sem espaços.", example: "4111111111111111" }
            holder: { type: string, minLength: 3, maxLength: 100 }
            expiryMonth: { type: string, pattern: '^(0[1-9]|1[0-2])$', example: "12" }
            expiryYear: { type: string, pattern: '^\d{4}$', example: "2027" }
            cvv: { type: string, minLength: 3, maxLength: 4 }

    PixPaymentPayload:
      type: object
      # studentId não vai no body: é derivado do JWT (claim sub) e ignorado se enviado.
      required: [sessionId, coachId, amount, method]
      properties:
        sessionId: { type: string, minLength: 1, maxLength: 128, description: "Referência opaca ao recurso pago (ex.: scheduleId). Não é UUID." }
        coachId: { type: string, format: uuid }
        amount:
          type: integer
          description: Valor em centavos (mínimo 100 = R$ 1,00).
          minimum: 100
        method:
          type: string
          enum: [pix]

    RefundPayload:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          description: Valor do estorno em centavos (mínimo 1).
          minimum: 1
        reason:
          type: string
          maxLength: 255
          nullable: true

    RefundResult:
      type: object
      required: [refundId, transactionId, status, amount, createdAt]
      properties:
        refundId: { type: string, example: refund_uuid }
        transactionId: { type: string, example: mock_uuid }
        status:
          type: string
          enum: [refunded]
        amount: { type: integer, description: Valor estornado em centavos. }
        reason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    # ── Upload ────────────────────────────────
    UploadUrlResponse:
      type: object
      required: [key, expiresIn, upload]
      properties:
        key:
          type: string
          example: uploads/1715800000000-perfil-joao.mp4
        expiresIn:
          type: integer
          description: Validade da URL em segundos.
          example: 300
        upload:
          type: object
          required: [url, fields]
          properties:
            url:
              type: string
              format: uri
              example: https://coachmatch-profile-videos-138413505977-sa-east-1-an.s3.sa-east-1.amazonaws.com
            fields:
              type: object
              additionalProperties: { type: string }
              description: |
                Campos da policy POST do S3 (key, Content-Type, X-Amz-Algorithm,
                X-Amz-Credential, X-Amz-Date, Policy, X-Amz-Signature,
                x-amz-security-token). Devem acompanhar o multipart/form-data.

    # ── Chat (Stream) ─────────────────────────
    ChatToken:
      type: object
      required: [apiKey, userId, token, expiresAt]
      properties:
        apiKey:
          type: string
          description: Chave pública do app no Stream (usada pelo client junto do token).
        userId:
          type: string
          example: 83dcfaba-f0c1-705d-b109-2b381fed0971
        token:
          type: string
          description: JWT do Stream para o usuário, válido por 24h.
        expiresAt:
          type: string
          format: date-time
          example: "2026-06-19T12:00:00.000Z"

    ChatConversationCreate:
      type: object
      required: [peerId]
      properties:
        peerId:
          type: string
          description: Id do par (o outro membro da conversa). Não pode ser o próprio usuário.
          example: 83dcfaba-f0c1-705d-b109-2b381fed0971

    ChatConversationUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 120
        frozen:
          type: boolean
          description: Quando `true`, congela a conversa (impede novas mensagens).

    ChatConversation:
      type: object
      required: [id, members, frozen]
      properties:
        id:
          type: string
          example: dm_1a2b3c4d_5e6f7a8b
        name:
          type: string
          nullable: true
        members:
          type: array
          items: { type: string }
        frozen:
          type: boolean
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        image:
          type: string
          nullable: true
          description: URL assinada da foto de perfil do par (resolvida a cada leitura).
        lastMessage:
          type: object
          nullable: true
          properties:
            id: { type: string }
            text: { type: string }
            userId: { type: string }

    ChatHidden:
      type: object
      required: [id, hidden]
      properties:
        id: { type: string, example: dm_1a2b3c4d_5e6f7a8b }
        hidden: { type: boolean, example: true }

    ChatMessageInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
          example: Bom treino hoje?

    ChatMessage:
      type: object
      required: [id, text, userId]
      properties:
        id: { type: string }
        text: { type: string }
        userId: { type: string }
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
