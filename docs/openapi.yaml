openapi: 3.0.3
info:
  title: CoachMatch API
  version: 0.4.0
  description: |
    Especificação das rotas implementadas no serviço `server/coachmatch` (Serverless Framework + DynamoDB).

    Rotas implementadas:
    - `/coach/*`   — treinadores autenticados (Cognito pool CoachAccess)
    - `/student/*` — alunos autenticados (Cognito pool StudentAccess)

    Rotas marcadas com `x-not-implemented: true` existem apenas como planejamento futuro.
    Endpoints de terceiros (Cognito OAuth) e helpers de desenvolvimento ficam fora deste contrato.
servers:
  - url: "https://api.coachmatch.com.br"
    description: API de produção CoachMatch.

tags:
  - name: Coach — Perfil
    description: Dados do treinador autenticado.
  - name: Coach — Uploads
    description: Geração de URLs pré-assinadas para upload direto ao S3.
  - name: Coach — Recursos
    description: Especialidades e academias acessadas pelo treinador.
  - name: Coach — Agenda
    description: Disponibilidades e gestão de agendamentos do treinador.
  - name: Student — Perfil
    description: Dados do aluno autenticado.
  - name: Student — Uploads
    description: Geração de URLs pré-assinadas para upload direto ao S3 (aluno).
  - name: Student — Recursos
    description: Especialidades e academias acessadas pelo aluno.
  - name: Student — Agenda
    description: Busca de slots e solicitações de agendamento do aluno.
  - name: Pagamentos
    description: Processamento de pagamentos via cartão de crédito ou PIX.
  - name: Chat
    description: >-
      Mensageria 1:1 aluno↔coach via Stream Chat. Cada rota existe sob
      `/coach/chat/*` (CoachAccess) e `/student/chat/*` (StudentAccess); a mesma
      Lambda atende os dois papéis.

security:
  - bearerAuth: []

paths:
  # ─────────────────────────────────────────────
  # Coach — Perfil
  # ─────────────────────────────────────────────
  /coach/me:
    get:
      tags: [Coach — Perfil]
      summary: Retorna o treinador autenticado.
      operationId: getCoachMe
      responses:
        "200":
          description: Treinador encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coach"
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      tags: [Coach — Perfil]
      summary: Atualiza perfil e locais de atendimento do treinador.
      operationId: updateCoachMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachUpdatePayload"
      responses:
        "200":
          description: Treinador atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coach"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─────────────────────────────────────────────
  # Coach — Uploads
  # ─────────────────────────────────────────────
  /coach/upload-url:
    post:
      tags: [Coach — Uploads]
      summary: Gera URL pré-assinada (POST policy do S3) para upload de foto ou vídeo.
      description: >-
        Mesmo endpoint serve foto e vídeo do treinador: aceita qualquer tipo de
        arquivo (o `contentType` vem da requisição), limitada apenas pelo tamanho
        máximo configurado e pelo prefixo `uploads/` na key. A `key` retornada é
        persistida no perfil via `photo_key`/`video_key` em PUT /coach/me; a leitura
        assina e devolve `photo_url`/`video_url`.
      operationId: createCoachUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentType]
              properties:
                filename:
                  type: string
                  example: perfil-joao.jpg
                contentType:
                  type: string
                  example: image/jpeg
      responses:
        "200":
          description: URL e campos para envio multipart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─────────────────────────────────────────────
  # Coach — Recursos
  # ─────────────────────────────────────────────
  /coach/specialties:
    get:
      tags: [Coach — Recursos]
      summary: Lista catálogo de especialidades (contexto treinador).
      operationId: listCoachSpecialties
      parameters:
        - in: query
          name: search
          schema: { type: string }
          example: Cross
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Lista paginada de especialidades.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Specialty"

  /coach/gyms:
    get:
      tags: [Coach — Recursos]
      summary: Lista academias cadastradas (contexto treinador).
      operationId: listCoachGyms
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: Busca por nome, endereço ou bairro.
          example: Fit
        - in: query
          name: city
          schema: { type: string }
          description: Cidade exata.
        - in: query
          name: cursor
          description: Token de paginação (nextCursor da página anterior).
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Lista academias no formato cursor.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Gym"
                  nextCursor:
                    type: string
                    nullable: true
                    example: eyJneW1JZCI6Imd5bV9iMWNhYzkzMiJ9

  /coach/gyms/suggest:
    post:
      tags: [Coach — Recursos]
      summary: Envia sugestão de nova academia (pelo treinador). Sempre criada como inativa.
      operationId: suggestGymAsCoach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymSuggestPayload"
      responses:
        "201":
          description: Sugestão registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymSuggestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─────────────────────────────────────────────
  # Coach — Agenda
  # ─────────────────────────────────────────────
  /coach/schedule:
    get:
      tags: [Coach — Agenda]
      summary: Lista disponibilidades do treinador autenticado.
      operationId: getCoachSchedule
      parameters:
        - name: startDateTime
          in: query
          schema:
            type: string
            format: date-time
          example: "2026-05-01T08:00:30-03:00"
        - name: endDateTime
          in: query
          schema:
            type: string
            format: date-time
          example: "2026-06-06T08:00:30-03:00"
      responses:
        "200":
          description: Lista de disponibilidades do treinador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachScheduleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Coach — Agenda]
      summary: Cria uma disponibilidade de agenda.
      operationId: createCoachSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreatePayload"
      responses:
        "201":
          description: Disponibilidade criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /coach/schedule/requests:
    get:
      tags: [Coach — Agenda]
      summary: Lista solicitações de agendamento recebidas pelo treinador.
      operationId: getCoachScheduleRequests
      parameters:
        - name: scheduleId
          in: query
          required: true
          schema:
            type: string
          example: avl_6cb2b644248448c68e63f350119c032d
      responses:
        "200":
          description: Solicitações do schedule, enriquecidas com o nome do aluno.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRequestsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /coach/schedule/approve:
    post:
      tags: [Coach — Agenda]
      summary: Aprova uma solicitação de agendamento.
      operationId: approveScheduleRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduleId, studentId]
              properties:
                scheduleId:
                  type: string
                  example: avl_6cb2b644248448c68e63f350119c032d
                studentId:
                  type: string
                  example: 037c4a8a-6031-705c-e02f-8e45f93bd387
      responses:
        "200":
          description: Solicitação aprovada; schedule passa a `BOOKED` e demais pedidos são rejeitados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleApproveResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /coach/schedule/cancel:
    post:
      tags: [Coach — Agenda]
      summary: Cancela uma disponibilidade de agenda (pelo treinador).
      operationId: cancelCoachSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduleId]
              properties:
                scheduleId:
                  type: string
                  example: avl_6cb2b644248448c68e63f350119c032d
      responses:
        "200":
          description: Disponibilidade cancelada; alunos com pedido pendente são notificados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleCancelResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /coach/schedule/class/status:
    post:
      tags: [Coach — Agenda]
      summary: Finaliza um atendimento (COMPLETED ou NOSHOW).
      operationId: updateClassStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduleId, status]
              properties:
                scheduleId:
                  type: string
                  example: avl_6cb2b644248448c68e63f350119c032d
                status:
                  $ref: "#/components/schemas/ClassStatus"
      responses:
        "200":
          description: Status atualizado; `paymentStatus` é definido como `PENDING`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassStatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /coach/students/{studentId}:
    get:
      tags: [Coach — Agenda]
      summary: Detalha um aluno para o coach (dados de treino, sem contato).
      description: >
        Retorna nome, gênero, data de nascimento, objetivo e o questionário PAR-Q
        (`health`) de um aluno, para uso do treinador na sessão. Não expõe dados de
        contato/identificação (email, telefone, endereço). Exige que o coach
        autenticado tenha ao menos uma sessão com o aluno (`403` caso contrário).
      operationId: getCoachStudentDetail
      parameters:
        - in: path
          name: studentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detalhe do aluno.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachStudentDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─────────────────────────────────────────────
  # Student — Perfil
  # ─────────────────────────────────────────────
  /student/me:
    get:
      tags: [Student — Perfil]
      summary: Retorna o aluno autenticado.
      operationId: getStudentMe
      responses:
        "200":
          description: Aluno encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /student/me/profile:
    post:
      tags: [Student — Perfil]
      summary: Conclui o cadastro de perfil do aluno.
      operationId: submitStudentProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientProfilePayload"
      responses:
        "200":
          description: Perfil registrado. Status do aluno avança para `ONBOARDING_HEALTH`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /student/me/health:
    post:
      tags: [Student — Perfil]
      summary: Envia o questionário de saúde e consentimentos do aluno.
      operationId: submitStudentHealth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientHealthPayload"
      responses:
        "200":
          description: Saúde registrada. Status avança para `ACTIVE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Consentimentos obrigatórios não aceitos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─────────────────────────────────────────────
  # Student — Uploads
  # ─────────────────────────────────────────────
  /student/upload-url:
    post:
      tags: [Student — Uploads]
      summary: Gera URL pré-assinada (POST policy do S3) para upload da foto do aluno.
      description: >-
        Mesmo endpoint de upload de foto/vídeo (o `contentType` vem da requisição),
        limitada pelo tamanho máximo configurado e pelo prefixo `uploads/` na key. A
        `key` retornada é persistida via `photo_key` em POST /student/me/profile; a
        leitura assina e devolve `photo_url`.
      operationId: createStudentUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentType]
              properties:
                filename:
                  type: string
                  example: foto-aluno.jpg
                contentType:
                  type: string
                  example: image/jpeg
      responses:
        "200":
          description: URL e campos para envio multipart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─────────────────────────────────────────────
  # Student — Recursos
  # ─────────────────────────────────────────────
  /student/specialties:
    get:
      tags: [Student — Recursos]
      summary: Lista catálogo de especialidades (contexto aluno).
      operationId: listStudentSpecialties
      parameters:
        - in: query
          name: search
          schema: { type: string }
          example: Cross
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Lista paginada de especialidades.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Specialty"

  /student/gyms:
    get:
      tags: [Student — Recursos]
      summary: Lista academias cadastradas (contexto aluno).
      operationId: listStudentGyms
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: Busca por nome, endereço ou bairro.
          example: Fit
        - in: query
          name: city
          schema: { type: string }
          description: Cidade exata.
        - in: query
          name: cursor
          description: Token de paginação (nextCursor da página anterior).
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Lista academias no formato cursor.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Gym"
                  nextCursor:
                    type: string
                    nullable: true
                    example: eyJneW1JZCI6Imd5bV9iMWNhYzkzMiJ9

  /student/gyms/suggest:
    post:
      tags: [Student — Recursos]
      summary: Envia sugestão de nova academia (pelo aluno). Sempre criada como inativa.
      operationId: suggestGymAsStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymSuggestPayload"
      responses:
        "201":
          description: Sugestão registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymSuggestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─────────────────────────────────────────────
  # Student — Agenda
  # ─────────────────────────────────────────────
  /student/gyms/schedule:
    get:
      tags: [Student — Agenda]
      summary: Lista disponibilidades em uma academia específica.
      operationId: getGymScheduleForStudent
      parameters:
        - name: gymId
          in: query
          required: true
          schema:
            type: string
          example: gym_sp005
        - name: startDateTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: "2026-05-01T08:00:30-03:00"
        - name: endDateTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: "2026-06-06T08:00:30-03:00"
      responses:
        "200":
          description: Disponibilidades na academia (status AVAILABLE ou REQUESTED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymScheduleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /student/coach/schedules:
    get:
      tags: [Student — Agenda]
      summary: Lista disponibilidades de um treinador específico.
      operationId: getCoachSchedulesForStudent
      parameters:
        - name: coachId
          in: query
          required: true
          schema:
            type: string
          example: 83dcfaba-f0c1-705d-b109-2b381fed0971
        - name: startDateTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: "2026-05-01T08:00:30-03:00"
        - name: endDateTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: "2026-06-06T08:00:30-03:00"
      responses:
        "200":
          description: Disponibilidades do treinador (status AVAILABLE ou REQUESTED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentCoachSchedulesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /student/coach/schedules/request:
    post:
      tags: [Student — Agenda]
      summary: Solicita um agendamento.
      operationId: requestSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduleId]
              properties:
                scheduleId:
                  type: string
                  example: avl_6cb2b644248448c68e63f350119c032d
      responses:
        "200":
          description: Solicitação registrada; o treinador é notificado por e-mail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRequestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    get:
      tags: [Student — Agenda]
      summary: Lista todos os schedules em que o aluno tem (ou teve) solicitação.
      operationId: listStudentScheduleRequests
      responses:
        "200":
          description: |
            Schedules do aluno ordenados por startDateTime crescente.
            Inclui schedules com status AVAILABLE, REQUESTED e BOOKED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSchedulesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    delete:
      tags: [Student — Agenda]
      summary: Cancela a solicitação de agendamento enquanto ainda está pendente (status REQUESTED).
      operationId: cancelScheduleRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduleId]
              properties:
                scheduleId:
                  type: string
                  example: avl_6cb2b644248448c68e63f350119c032d
      responses:
        "200":
          description: |
            Solicitação cancelada. O schedule pode voltar para AVAILABLE se não houver
            outros pedidos pendentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelRequestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /student/coaches:
    get:
      tags: [Student — Agenda]
      summary: Busca treinadores publicamente listáveis.
      description: >
        Retorna apenas treinadores ativos (status `APPROVED`). Os resultados são
        ordenados de forma estável por `coachId`.
      operationId: searchCoaches
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Termo livre (nome ou especialidade).
        - in: query
          name: "specialties[]"
          description: Filtra por uma ou mais especialidades. Pode repetir o parâmetro.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 12 }
        - in: query
          name: lastKey
          description: >
            Cursor de paginação. JSON serializado devolvido em `meta.lastKey` da
            página anterior (ex.: {"coachId":"..."}). Ausente na primeira página.
          schema: { type: string }
      responses:
        "200":
          description: Página da listagem de treinadores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachSearchResponse"

  /student/coaches/{coachId}:
    get:
      tags: [Student — Agenda]
      summary: Detalha um treinador publicamente listável.
      description: >
        Retorna os dados não sensíveis de um treinador `APPROVED`, com as
        localidades do tipo GYM enriquecidas com os dados da academia. Treinadores
        inexistentes ou não listáveis respondem 404.
      operationId: getCoachDetail
      parameters:
        - in: path
          name: coachId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detalhe do treinador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /student/coach/schedules/cancel:
    post:
      tags: [Student — Agenda]
      summary: Cancela um agendamento aprovado (pelo aluno).
      operationId: cancelStudentSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduleId]
              properties:
                scheduleId:
                  type: string
                  example: avl_6cb2b644248448c68e63f350119c032d
      responses:
        "200":
          description: Agendamento cancelado; o treinador é notificado por e-mail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleCancelResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ─────────────────────────────────────────────
  # Pagamentos
  # ─────────────────────────────────────────────
  /payments:
    post:
      tags: [Pagamentos]
      summary: Cria um pagamento (cartão de crédito ou PIX).
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CardPaymentPayload"
                - $ref: "#/components/schemas/PixPaymentPayload"
              discriminator:
                propertyName: method
                mapping:
                  credit_card: "#/components/schemas/CardPaymentPayload"
                  pix: "#/components/schemas/PixPaymentPayload"
      responses:
        "201":
          description: Pagamento aprovado ou em processamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Pagamento recusado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /payments/{transactionId}:
    get:
      tags: [Pagamentos]
      summary: Busca uma transação pelo ID.
      operationId: getPayment
      parameters:
        - in: path
          name: transactionId
          required: true
          schema: { type: string, example: mock_uuid }
      responses:
        "200":
          description: Transação encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments/{transactionId}/refund:
    post:
      tags: [Pagamentos]
      summary: Solicita estorno de uma transação.
      operationId: refundPayment
      parameters:
        - in: path
          name: transactionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundPayload"
      responses:
        "200":
          description: Estorno registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /payments/coach/{coachId}:
