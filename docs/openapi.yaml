openapi: 3.0.3
info:
  title: CoachMatch API
  version: 0.1.0
  description: |
    Especificação derivada das chamadas feitas pelo frontend (`client/src/api/*`)
    e pelos handlers MSW (`client/src/mocks/handlers.ts`).

    Endpoints de terceiros (IBGE, ViaCEP) e helpers de desenvolvimento (`/dev/*`)
    ficam fora deste contrato.
servers:
  - url: '{apiBaseUrl}'
    description: Base configurada via `VITE_API_BASE_URL`.
    variables:
      apiBaseUrl:
        default: https://api.coachmatch.app
        description: Origem da API CoachMatch.

tags:
  - name: Clients
    description: Recursos do aluno autenticado.
  - name: Coaches
    description: Recursos do treinador autenticado e busca pública.
  - name: Gyms
    description: Academias cadastradas e sugestões.
  - name: Specialties
    description: Catálogo de especialidades.
  - name: Uploads
    description: Geração de URLs pré-assinadas para upload direto ao S3.

security:
  - bearerAuth: []

paths:
  /clients/me:
    get:
      tags: [Clients]
      summary: Retorna o aluno autenticado.
      operationId: getClientMe
      responses:
        '200':
          description: Aluno encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /clients/me/profile:
    post:
      tags: [Clients]
      summary: Conclui o cadastro de perfil do aluno.
      operationId: submitClientProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientProfilePayload'
      responses:
        '200':
          description: Perfil registrado. Status do aluno avança para `ONBOARDING_HEALTH`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /clients/me/health:
    post:
      tags: [Clients]
      summary: Envia o questionário de saúde e consentimentos do aluno.
      operationId: submitClientHealth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientHealthPayload'
      responses:
        '200':
          description: Saúde registrada. Status avança para `ACTIVE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          description: Consentimentos obrigatórios não aceitos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /coaches:
    get:
      tags: [Coaches]
      summary: Busca treinadores publicamente listáveis.
      operationId: searchCoaches
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Termo livre (nome, cidade, bairro, especialidade).
        - in: query
          name: 'specialties[]'
          description: Filtra por uma ou mais especialidades. Pode repetir o parâmetro.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - in: query
          name: address
          schema: { type: string }
          description: Filtro por bairro/cidade.
        - in: query
          name: priceMin
          schema: { type: integer, minimum: 0 }
        - in: query
          name: priceMax
          schema: { type: integer, minimum: 0 }
        - in: query
          name: availableOn
          schema: { type: string, format: date }
          description: Data ISO (yyyy-mm-dd) para filtrar disponibilidade.
        - in: query
          name: sort
          schema:
            $ref: '#/components/schemas/CoachSearchSort'
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 12 }
      responses:
        '200':
          description: Resultado paginado da busca.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CoachListItem'

  /coaches/me:
    get:
      tags: [Coaches]
      summary: Retorna o treinador autenticado.
      operationId: getCoachMe
      responses:
        '200':
          description: Treinador encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coach'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [Coaches]
      summary: Atualiza perfil e locais de atendimento do treinador.
      operationId: updateCoachMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachUpdatePayload'
      responses:
        '200':
          description: Treinador atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coach'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /coaches/me/submit-for-review:
    post:
      tags: [Coaches]
      summary: Submete o perfil do treinador para análise.
      operationId: submitCoachForReview
      responses:
        '200':
          description: Status atualizado para `PENDING_REVIEW`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coach'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Estado atual não permite submissão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gyms:
    get:
      tags: [Gyms]
      summary: Lista academias cadastradas.
      operationId: listGyms
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: Busca por nome, endereço ou bairro.
        - in: query
          name: city
          schema: { type: string }
          description: Cidade exata.
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Lista paginada de academias.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Gym'

  /gyms/suggest:
    post:
      tags: [Gyms]
      summary: Envia sugestão de nova academia.
      operationId: suggestGym
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GymSuggestPayload'
      responses:
        '201':
          description: Sugestão registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymSuggestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /specialties:
    get:
      tags: [Specialties]
      summary: Lista catálogo de especialidades.
      operationId: listSpecialties
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Lista paginada de especialidades.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Specialty'

  /upload-url:
    post:
      tags: [Uploads]
      summary: Gera URL pré-assinada (POST policy do S3) para upload direto.
      operationId: createUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentType]
              properties:
                filename:
                  type: string
                  example: perfil.jpg
                contentType:
                  type: string
                  example: image/jpeg
      responses:
        '200':
          description: URL e campos para envio multipart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token emitido pelo Amazon Cognito (papel ativo: aluno ou treinador).

  responses:
    Unauthorized:
      description: Token ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Payload inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Consentimentos obrigatórios.
      required: [error]

    Coordinates:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double, example: -23.561414 }
        lng: { type: number, format: double, example: -46.655881 }

    Pagination:
      type: object
      required: [page, limit, total, totalPages, hasNext, hasPrev]
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 12 }
        total: { type: integer, example: 42 }
        totalPages: { type: integer, example: 4 }
        hasNext: { type: boolean }
        hasPrev: { type: boolean }

    PaginatedEnvelope:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: {}
        pagination:
          $ref: '#/components/schemas/Pagination'

    # --- Client ---
    ClientStatus:
      type: string
      enum: [ONBOARDING_PROFILE, ONBOARDING_HEALTH, ACTIVE]

    Client:
      type: object
      required: [clientId, email, status, createdAt, updatedAt]
      properties:
        clientId: { type: string, example: client_demo }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/ClientStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ClientProfilePayload:
      type: object
      required: [phone, birthDate, gender, cep, city, state, radius, goal]
      properties:
        phone: { type: string, example: '+5511999990000' }
        birthDate: { type: string, format: date }
        gender:
          type: string
          enum: [F, M, NB, NA]
        cep: { type: string, example: '01310-100' }
        city: { type: string, example: São Paulo }
        state: { type: string, minLength: 2, maxLength: 2, example: SP }
        radius:
          type: integer
          enum: [5, 10, 20]
          description: Raio de atendimento em km.
        goal:
          type: string
          enum: [WEIGHT_LOSS, HYPERTROPHY, CONDITIONING, REHAB, PERFORMANCE]

    ClientHealthPayload:
      type: object
      required: [answers, notes, lgpdConsent, medicalDisclaimer]
      properties:
        answers:
          type: object
          additionalProperties:
            type: string
            enum: [YES, NO]
          description: Mapa pergunta → resposta.
        notes:
          type: string
          description: Observações livres do aluno.
        lgpdConsent: { type: boolean }
        medicalDisclaimer: { type: boolean }

    # --- Coach ---
    CoachStatus:
      type: string
      enum: [ONBOARDING_PROFILE, PENDING_REVIEW, APPROVED, REJECTED]

    CoachVisibility:
      type: string
      enum: [VISIBLE, INVISIBLE]

    CoachProfile:
      type: object
      required: [name, phone, specialties, cref, instagram, profile_video]
      properties:
        name: { type: string }
        phone:
          type: string
          nullable: true
        specialties:
          type: array
          items: { type: string }
        cref: { type: string, example: 'CREF 012345-G/SP' }
        instagram: { type: string, example: '@treinador' }
        profile_video:
          type: boolean
          description: Indica se há vídeo de apresentação enviado.

    WorkLocationGym:
      type: object
      required: [type, gymId]
      properties:
        type:
          type: string
          enum: [GYM]
        gymId: { type: string }

    HomeServiceCoverage:
      type: object
      required: [city, state, neighborhoods]
      properties:
        city: { type: string }
        state: { type: string, minLength: 2, maxLength: 2 }
        neighborhoods:
          type: array
          items: { type: string }

    WorkLocationHomeService:
      type: object
      required: [type, coverage]
      properties:
        type:
          type: string
          enum: [HOME_SERVICE]
        coverage:
          $ref: '#/components/schemas/HomeServiceCoverage'

    WorkLocation:
      oneOf:
        - $ref: '#/components/schemas/WorkLocationGym'
        - $ref: '#/components/schemas/WorkLocationHomeService'
      discriminator:
        propertyName: type
        mapping:
          GYM: '#/components/schemas/WorkLocationGym'
          HOME_SERVICE: '#/components/schemas/WorkLocationHomeService'

    Coach:
      type: object
      required:
        [coachId, email, status, visibility, profile, work_location, createdAt, updatedAt]
      properties:
        coachId: { type: string }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/CoachStatus' }
        visibility: { $ref: '#/components/schemas/CoachVisibility' }
        profile: { $ref: '#/components/schemas/CoachProfile' }
        work_location:
          type: array
          items:
            $ref: '#/components/schemas/WorkLocation'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CoachUpdatePayload:
      type: object
      properties:
        profile:
          allOf:
            - $ref: '#/components/schemas/CoachProfile'
          description: Campos parciais aceitos.
        work_location:
          type: array
          items:
            $ref: '#/components/schemas/WorkLocation'

    CoachSearchSort:
      type: string
      enum: [rating, price_asc, price_desc]
      default: rating

    CoachListItem:
      type: object
      required:
        [coachId, name, specialties, rating, priceFrom, neighborhood, city, nextAvailability, photo]
      properties:
        coachId: { type: string }
        name: { type: string }
        specialties:
          type: array
          items: { type: string }
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
        priceFrom:
          type: number
          description: Preço a partir de (em BRL).
        neighborhood: { type: string }
        city: { type: string }
        nextAvailability:
          type: string
          description: Texto curto com a próxima janela disponível.
        photo:
          type: string
          nullable: true

    # --- Gym ---
    Gym:
      type: object
      required: [gymId, name, address, city, state, neighborhood, coordinates]
      properties:
        gymId: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string, minLength: 2, maxLength: 2 }
        neighborhood: { type: string }
        coordinates:
          $ref: '#/components/schemas/Coordinates'

    GymSuggestPayload:
      type: object
      required: [name, address, city, state, neighborhood, coordinates]
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string, minLength: 2, maxLength: 2 }
        neighborhood: { type: string }
        coordinates:
          $ref: '#/components/schemas/Coordinates'

    GymSuggestResponse:
      type: object
      required: [data, message]
      properties:
        data: { $ref: '#/components/schemas/Gym' }
        message:
          type: string
          example: Sugestão registrada com sucesso. Aguardando aprovação.

    # --- Specialty ---
    Specialty:
      type: object
      required: [id, label]
      properties:
        id: { type: string, example: musculacao }
        label: { type: string, example: Musculação }

    # --- Upload ---
    UploadUrlResponse:
      type: object
      required: [key, expiresIn, upload]
      properties:
        key:
          type: string
          example: uploads/1715800000000-perfil.jpg
        expiresIn:
          type: integer
          description: Validade da URL em segundos.
          example: 300
        upload:
          type: object
          required: [url, fields]
          properties:
            url:
              type: string
              format: uri
              example: https://coachmatch-uploads.s3.amazonaws.com
            fields:
              type: object
              additionalProperties: { type: string }
              description: Campos da policy POST do S3, devem acompanhar o `multipart/form-data`.
