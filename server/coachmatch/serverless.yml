resources:
  Conditions:
    IsLocal: !Equals [ "${param:stage}", "local" ]
    HasApiDomain: !Not [ !Equals [ "${param:apiDomainName}", "" ] ]
  Resources:
    gymsTable:
      Type: AWS::DynamoDB::Table
      Condition: IsLocal
      Properties:
        TableName: ${param:gymsTable}
        AttributeDefinitions:
          - AttributeName: gymId
            AttributeType: S
        KeySchema:
          - AttributeName: gymId
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
    usersTable:
      Type: AWS::DynamoDB::Table
      Condition: IsLocal
      Properties:
        TableName: ${param:coachesTable}
        AttributeDefinitions:
          - AttributeName: coachId
            AttributeType: S
          - AttributeName: status
            AttributeType: S
        KeySchema:
          - AttributeName: coachId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: status-coachId-index
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: coachId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 1
              WriteCapacityUnits: 1
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
    studentTable:
      Type: AWS::DynamoDB::Table
      Condition: IsLocal
      Properties:
        TableName: ${param:studentsTable}
        AttributeDefinitions:
          - AttributeName: studentId
            AttributeType: S
        KeySchema:
          - AttributeName: studentId
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1

    paymentsTable:
      Type: AWS::DynamoDB::Table
      Condition: IsLocal
      Properties:
        TableName: ${param:paymentsTable}
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
          - AttributeName: GSI2PK
            AttributeType: S
          - AttributeName: GSI2SK
            AttributeType: S
          - AttributeName: GSI3PK
            AttributeType: S
          - AttributeName: GSI3SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 1
              WriteCapacityUnits: 1
          - IndexName: GSI2
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH
              - AttributeName: GSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 1
              WriteCapacityUnits: 1
          - IndexName: GSI3
            KeySchema:
              - AttributeName: GSI3PK
                KeyType: HASH
              - AttributeName: GSI3SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 1
              WriteCapacityUnits: 1
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1

    specialtiesTable:
      Type: AWS::DynamoDB::Table
      Condition: IsLocal
      Properties:
        TableName: ${param:specialtiesTable}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1

    scheduleTable:
      Type: AWS::DynamoDB::Table
      Condition: IsLocal
      Properties:
        TableName: ${param:scheduleTable}
        AttributeDefinitions:
          - AttributeName: scheduleId
            AttributeType: S
          - AttributeName: coachId
            AttributeType: S
          - AttributeName: gymId
            AttributeType: S
          - AttributeName: studentId
            AttributeType: S
          - AttributeName: startDateTime
            AttributeType: S
        KeySchema:
          - AttributeName: scheduleId
            KeyType: HASH
        GlobalSecondaryIndexes:
          # A tabela AWS tem um terceiro atributo no schema de Gym_Date, mas o
          # código consulta somente gymId + startDateTime. O DynamoDB Local usa
          # a forma válida equivalente: uma HASH e uma RANGE.
          - IndexName: Coach_Date
            KeySchema:
              - AttributeName: coachId
                KeyType: HASH
              - AttributeName: startDateTime
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 1
              WriteCapacityUnits: 1
          - IndexName: Gym_Date
            KeySchema:
              - AttributeName: gymId
                KeyType: HASH
              - AttributeName: startDateTime
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 1
              WriteCapacityUnits: 1
          - IndexName: Student_Date
            KeySchema:
              - AttributeName: studentId
                KeyType: HASH
              - AttributeName: startDateTime
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 1
              WriteCapacityUnits: 1
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1

    # Liga o domínio à API deste stack. O domínio e o certificado ficam fora do stack.
    # O API Gateway aceita um único mapping com chave vazia por domínio: para mover o
    # domínio de stage, o stage antigo precisa liberá-lo antes do novo criar o seu.
    ApiDomainMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Condition: HasApiDomain
      Properties:
        DomainName: ${param:apiDomainName}
        ApiId: !Ref HttpApi
        Stage: !Ref HttpApiStage

    # Fila do evento payment.succeeded (gerenciada pelo stack, todos os stages)
    PaymentSucceededQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: payment-succeeded-${param:stage}
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt PaymentSucceededDLQ.Arn
          maxReceiveCount: 3
    PaymentSucceededDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: payment-succeeded-dlq-${param:stage}
        MessageRetentionPeriod: 1209600

custom:
  config: ${file(./config.yml)}

  dynamodb:
    stages:
      - local
    start:
      port: 8000
      inMemory: true
      migrate: true
      seed: true
    seed:
      local:
        sources:
          - table: ${param:gymsTable}
            sources: [./seed/gyms.json]
          - table: ${param:specialtiesTable}
            sources: [./seed/specialties.json]
  serverless-offline:
    ignoreJWTSignature: true
    host: 0.0.0.0

  # ─── OTel / ADOT ────────────────────────────────────────────────────────────
  # Layer removido temporariamente — ARN precisa ser verificado em sa-east-1.
  # Para reativar: descobrir ARN correto via `aws lambda list-layer-versions
  # --layer-name arn:aws:lambda:sa-east-1:901920570463:layer:aws-otel-nodejs-amd64
  # --region sa-east-1` e atualizar otelLayers.dev abaixo.
  otelLayers:
    prod:
      - "arn:aws:lambda:sa-east-1:050451360540:layer:opentelemetry-collector-grafana-amd64-v0_138_0:2"
    dev:
      - "arn:aws:lambda:sa-east-1:050451360540:layer:opentelemetry-collector-grafana-amd64-v0_138_0:2"
    local: []

  otelWrapper:
    dev: ""
    local: ""

  otelCollectorUri:
    dev: ""
    local: ""
