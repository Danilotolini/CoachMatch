# HTTP API
# ─────────────────────────────────────────────────────────────────────────────
# A API, os authorizers JWT e o CORS são criados por este stack em todos os
# stages; também o API mapping do domínio, quando o stage declara `apiDomainName`.
# Ficam fora apenas o custom domain e o certificado. O DNS aponta para o custom
# domain, não para a API, então trocar a API servida não muda DNS (ver DEPLOY.md).
# ─────────────────────────────────────────────────────────────────────────────
org: coachmatch
app: coachmatchapp
service: coachmatch

stages:
  default:
    params:
      coachesTable: ${self:custom.config.${sls:stage}.coachesTable}
      gymsTable: ${self:custom.config.${sls:stage}.gymsTable}
      paymentsTable: ${self:custom.config.${sls:stage}.paymentsTable}
      scheduleTable: ${self:custom.config.${sls:stage}.scheduleTable}
      specialtiesTable: ${self:custom.config.${sls:stage}.specialtiesTable}
      studentsTable: ${self:custom.config.${sls:stage}.studentsTable}
      coachUserPoolName: ${self:custom.config.${sls:stage}.coachUserPoolName}
      coachUserPoolId: ${self:custom.config.${sls:stage}.coachUserPoolId}
      coachUserPoolClientId: ${self:custom.config.${sls:stage}.coachUserPoolClientId}
      studentUserPoolName: ${self:custom.config.${sls:stage}.studentUserPoolName}
      studentUserPoolId: ${self:custom.config.${sls:stage}.studentUserPoolId}
      studentUserPoolClientId: ${self:custom.config.${sls:stage}.studentUserPoolClientId}
      mediaBucketName: ${self:custom.config.${sls:stage}.mediaBucketName}
      corsAllowedOrigins: ${self:custom.config.${sls:stage}.corsAllowedOrigins}
      apiDomainName: ${self:custom.config.${sls:stage}.apiDomainName, ""}
  # Produção — deploy só via `pnpm deploy:prod`, que exige confirmação (ver DEPLOY.md)
  prod:
    params:
      stage: ${self:custom.config.prod.stage}
      region: ${self:custom.config.prod.region}
      apiKey: ${self:custom.config.prod.apiKey}
      apiSecret: ${self:custom.config.prod.apiSecret}
      mailSenderQueueUrl: ${self:custom.config.prod.mailSenderQueueUrl}
  # Desenvolvimento — `pnpm deploy:dev`
  dev:
    params:
      stage: ${self:custom.config.dev.stage}
      region: ${self:custom.config.dev.region}
      apiKey: ${self:custom.config.dev.apiKey}
      apiSecret: ${self:custom.config.dev.apiSecret}
      mailSenderQueueUrl: ${self:custom.config.dev.mailSenderQueueUrl}
  # Stage local — serverless-offline + DynamoDB Local (nunca faz deploy na AWS)
  local:
    params:
      stage: ${self:custom.config.local.stage}
      region: ${self:custom.config.local.region}
      endpoint: ${self:custom.config.local.endpoint}
      access_key_id: ${self:custom.config.local.accessKeyId}
      secret_access: ${self:custom.config.local.secretAccessKey}
      apiKey: ${self:custom.config.dev.apiKey}
      apiSecret: ${self:custom.config.dev.apiSecret}
      mailSenderQueueUrl: ""

plugins:
  - serverless-dynamodb
  - serverless-offline

package:
  individually: true
  patterns:
    - '!node_modules/aws-sdk/**'

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: false
    #
    # Projeto é "type": "module" e o SF v4 deploya o package.json junto, então
    # o bundle .js roda como ESM no Lambda. Deps CommonJS (joi → @hapi/address)
    # usam require() dinâmico, que o shim ESM do esbuild não provê — o banner
    # recria require() via createRequire. É o padrão para ESM + esbuild no SF v4.
    format: esm
    banner:
      js: "import { createRequire as topLevelCreateRequire } from 'module'; const require = topLevelCreateRequire(import.meta.url);"

provider:
  # Credenciais AWS vêm do ambiente: AWS_PROFILE (SSO local) ou AWS_ACCESS_KEY_ID/SECRET (CI/CD).
  # HTTP API limita a integração a 30s; mantemos a Lambda 1s abaixo para que ela
  # termine antes do gateway cortar a conexão (evita "timeout" em invocação que deu certo).
  timeout: 29
  name: aws
  runtime: nodejs22.x
  stage: ${param:stage}
  region: ${param:region}

  # Bucket privado de mídias (foto/vídeo). Os endpoints de leitura assinam URLs de GET.
  # Fica em provider.environment para valer em todas as funções que chamam shared/s3.js.
  environment:
    STAGE: ${param:stage}
    REGION: ${param:region}
    ENDPOINT: ${param:endpoint, ""}
    ACCESS_KEY_ID: ${param:access_key_id, ""}
    SECRET_ACCESS_KEY: ${param:secret_access, ""}
    COACHES_TABLE: ${param:coachesTable}
    GYMS_TABLE: ${param:gymsTable}
    PAYMENTS_TABLE: ${param:paymentsTable}
    SCHEDULE_TABLE: ${param:scheduleTable}
    SPECIALTIES_TABLE: ${param:specialtiesTable}
    STUDENTS_TABLE: ${param:studentsTable}
    BUCKET_NAME: ${param:mediaBucketName}
    SIGNED_URL_EXPIRES: ${param:signedUrlExpires, "3600"}
    MAIL_SENDER_QUEUE_URL: ${param:mailSenderQueueUrl, ""}
    OTEL_SERVICE_NAME: coachmatch-${param:stage}
    GRAFANA_CLOUD_INSTANCE_ID: "1808134"
    GRAFANA_CLOUD_OTLP_ENDPOINT: "https://otlp-gateway-prod-sa-east-1.grafana.net/otlp"
    GRAFANA_CLOUD_API_KEY_ARN: "arn:aws:secretsmanager:sa-east-1:138413505977:secret:grafana-cloud-api-key-jDrQtP"

  layers: ${self:custom.otelLayers.${sls:stage}}

  httpApi:
    name: coachmatch-${param:stage}
    cors:
      # Sem `*`: só os fronts que chamam a API deste stage.
      allowedOrigins: ${param:corsAllowedOrigins}
      allowedHeaders:
        - '*'
      allowedMethods:
        - '*'
      exposedResponseHeaders:
        - '*'
    authorizers:
      # Pool de coaches — rotas /coach/*
      coachAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.sa-east-1.amazonaws.com/${param:coachUserPoolId}
        audience:
          - ${param:coachUserPoolClientId}
      # Pool de alunos — rotas /student/* e /payments/*
      studentAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.sa-east-1.amazonaws.com/${param:studentUserPoolId}
        audience:
          - ${param:studentUserPoolClientId}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:BatchGetItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:sa-east-1:138413505977:table/${param:coachesTable}
            - arn:aws:dynamodb:sa-east-1:138413505977:table/${param:coachesTable}/index/*
            - arn:aws:dynamodb:sa-east-1:138413505977:table/${param:studentsTable}
            - arn:aws:dynamodb:sa-east-1:138413505977:table/${param:gymsTable}
            - arn:aws:dynamodb:sa-east-1:138413505977:table/${param:paymentsTable}
            - arn:aws:dynamodb:sa-east-1:138413505977:table/${param:paymentsTable}/index/*
            - arn:aws:dynamodb:sa-east-1:138413505977:table/${param:specialtiesTable}
        # onPaymentSucceeded e as funções de agendamento compartilham a tabela.
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:GetItem
            - dynamodb:BatchGetItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:sa-east-1:138413505977:table/${param:scheduleTable}
            - arn:aws:dynamodb:sa-east-1:138413505977:table/${param:scheduleTable}/index/*
        # paymentCreate emite o evento payment.succeeded
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - !GetAtt PaymentSucceededQueue.Arn
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - arn:aws:sqs:sa-east-1:138413505977:MailSender
        # Endpoints de leitura assinam URLs de GET das mídias (foto/vídeo) no bucket privado
        - Effect: Allow
          Action:
            - s3:GetObject
          Resource:
            - arn:aws:s3:::${param:mediaBucketName}/*
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${param:mediaBucketName}/*
        # Grafana Lambda Extension lê o API key do Secrets Manager na inicialização
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:sa-east-1:138413505977:secret:grafana-cloud-api-key-*

functions:

  gymGet:
    handler: src/gyms/list-gyms/handler.handler
    environment:
      STAGE: ${param:stage}
      REGION: ${param:region}
      ENDPOINT: ${param:endpoint, ""}
