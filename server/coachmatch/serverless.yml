# API GATEWAY COMPARTILHADO (HTTP API qht6965nv9, sa-east-1)
# ─────────────────────────────────────────────────────────────────────────────
# O stack usa uma API EXTERNA (httpApi.id). As rotas Node são gerenciadas por
# este stack; as rotas Python e os authorizers JWT (bg0uj6 coach / ahu157 student)
# são criados manualmente, fora do stack.
#
# Como a API é externa, o Serverless NÃO pode gerenciar authorizers nela — por isso
# eles são referenciados por `id` no evento em `dev` (ver custom.coachAuthorizer /
# custom.studentAuthorizer e custom.httpApiByStage). No `local`, o serverless-offline
# sobe a própria API e usa os authorizers declarados por nome.
# ─────────────────────────────────────────────────────────────────────────────
org: coachmatch
app: coachmatchapp
service: coachmatch

stages:
  # Stage para deploy real na AWS (CI/CD e deploys manuais do dev)
  dev:
    params:
      stage: ${self:custom.config.dev.stage}
      region: ${self:custom.config.dev.region}
      apiGatewayId: ${self:custom.config.dev.apiGatewayId}
      apiKey: ${self:custom.config.dev.apiKey}
      apiSecret: ${self:custom.config.dev.apiSecret}
      # AWS OTel Lambda Layer — Node.js amd64, sa-east-1.
      # Verificar versão mais recente em: https://github.com/aws-observability/aws-otel-lambda/releases
      otelLayerArn: "arn:aws:lambda:sa-east-1:901920570463:layer:aws-otel-nodejs-amd64-ver-1-30-0:1"
      # Grafana Cloud OTLP — setar como secrets no GitHub Actions:
      #   GRAFANA_OTLP_ENDPOINT → https://otlp-gateway-prod-<REGION>.grafana.net/otlp
      #   GRAFANA_OTLP_TOKEN    → Base64("<instanceId>:<apiKey>") — gerado em grafana.com → My Account → OTLP
      grafanaOtlpEndpoint: ${env:GRAFANA_OTLP_ENDPOINT, ""}
      grafanaOtlpToken: ${env:GRAFANA_OTLP_TOKEN, ""}
  # Stage local — serverless-offline + DynamoDB Local (nunca faz deploy na AWS)
  local:
    params:
      stage: ${self:custom.config.local.stage}
      region: ${self:custom.config.local.region}
      endpoint: ${self:custom.config.local.endpoint}
      access_key_id: ${self:custom.config.local.accessKeyId}
      secret_access: ${self:custom.config.local.secretAccessKey}
      apiKey: ${self:custom.config.dev.apiKey}
      apiSecret: ${self:custom.config.dev.apiSecret}
      otelLayerArn: ""
      grafanaOtlpEndpoint: ""
      grafanaOtlpToken: ""

plugins:
  - serverless-dynamodb
  - serverless-offline

package:
  individually: true
  patterns:
    - '!node_modules/aws-sdk/**'

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: false
    #
    # Projeto é "type": "module" e o SF v4 deploya o package.json junto, então
    # o bundle .js roda como ESM no Lambda. Deps CommonJS (joi → @hapi/address)
    # usam require() dinâmico, que o shim ESM do esbuild não provê — o banner
    # recria require() via createRequire. É o padrão para ESM + esbuild no SF v4.
    format: esm
    banner:
      js: "import { createRequire as topLevelCreateRequire } from 'module'; const require = topLevelCreateRequire(import.meta.url);"

provider:
  # Credenciais AWS vêm do ambiente: AWS_PROFILE (SSO local) ou AWS_ACCESS_KEY_ID/SECRET (CI/CD).
  # HTTP API limita a integração a 30s; mantemos a Lambda 1s abaixo para que ela
  # termine antes do gateway cortar a conexão (evita "timeout" em invocação que deu certo).
  timeout: 29
  name: aws
  runtime: nodejs22.x
  stage: ${param:stage}
  region: ${param:region}

  # Bucket privado de mídias (foto/vídeo). Os endpoints de leitura assinam URLs de GET.
  # Fica em provider.environment para valer em todas as funções que chamam shared/s3.js.
  # É o mesmo bucket usado pela lambda Python de upload (generate-profile-video-upload-url).
  environment:
    BUCKET_NAME: ${param:bucketName, "coachmatch-profile-videos-138413505977-sa-east-1-an"}
    SIGNED_URL_EXPIRES: ${param:signedUrlExpires, "3600"}
    # OTel — ADOT Collector embutido como Lambda Extension (via layer em custom.otelLayers).
    # AWS_LAMBDA_EXEC_WRAPPER ativa auto-instrumentação de DynamoDB, HTTP e SQS.
    # Em `local` estes valores ficam vazios (ver custom.otelWrapper / custom.otelCollectorUri).
    OTEL_SERVICE_NAME: coachmatch-${param:stage}
    AWS_LAMBDA_EXEC_WRAPPER: ${self:custom.otelWrapper.${sls:stage}}
    OPENTELEMETRY_COLLECTOR_CONFIG_URI: ${self:custom.otelCollectorUri.${sls:stage}}
    GRAFANA_OTLP_ENDPOINT: ${param:grafanaOtlpEndpoint}
    GRAFANA_OTLP_TOKEN: ${param:grafanaOtlpToken}

  # ADOT Layer — desativado até confirmar ARN correto em sa-east-1.
  # layers: ${self:custom.otelLayers.${sls:stage}}

  # httpApi por stage (ver custom.httpApiByStage):
  #   • dev   → API externa (id = qht6965nv9). O Serverless NÃO pode gerenciar
  #             authorizers numa API externa, então NÃO declaramos o bloco
  #             `authorizers` aqui; cada rota referencia o authorizer já existente
  #             por id (custom.coachAuthorizer / custom.studentAuthorizer).
  #   • local → id vazio (serverless-offline sobe a própria API) + authorizers
  #             declarados por nome para o offline validar o JWT.
  httpApi: ${self:custom.httpApiByStage.${sls:stage}}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:BatchGetItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:sa-east-1:138413505977:table/coaches
            - arn:aws:dynamodb:sa-east-1:138413505977:table/coaches/index/*
            - arn:aws:dynamodb:sa-east-1:138413505977:table/student
            - arn:aws:dynamodb:sa-east-1:138413505977:table/gyms
            - arn:aws:dynamodb:sa-east-1:138413505977:table/payments
            - arn:aws:dynamodb:sa-east-1:138413505977:table/payments/index/*
        # onPaymentSucceeded grava paymentStatus no schedule
        - Effect: Allow
          Action:
            - dynamodb:UpdateItem
            - dynamodb:GetItem
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:sa-east-1:138413505977:table/schedule
            - arn:aws:dynamodb:sa-east-1:138413505977:table/schedule/index/*
        # paymentCreate emite o evento payment.succeeded
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - !GetAtt PaymentSucceededQueue.Arn
        # Endpoints de leitura assinam URLs de GET das mídias (foto/vídeo) no bucket privado
        - Effect: Allow
          Action:
            - s3:GetObject
          Resource:
            - arn:aws:s3:::coachmatch-profile-videos-138413505977-sa-east-1-an/*

