org: coachmatch
app: coachmatchapp
service: coachmatch

stages:
  dev:
    params:
      stage: ${self:custom.config.dev.stage}
      region: ${self:custom.config.dev.region}
      apiGatewayId: ${self:custom.config.dev.apiGatewayId}
  local:
    params:
      stage: ${self:custom.config.local.stage}
      region: ${self:custom.config.local.region}
      endpoint: ${self:custom.config.local.endpoint}
      access_key_id: ${self:custom.config.local.accessKeyId}
      secret_access: ${self:custom.config.local.secretAccessKey}

plugins:
  - serverless-esbuild
  - serverless-dynamodb
  - serverless-offline
  
package:
  individually: true
  patterns:
    - '!node_modules/aws-sdk/**'

build:
  esbuild: false

    
provider:
  runtime: nodejs18.x
  profile: JoaoAdm
  timeout: 30
  name: aws
  stage: ${param:stage}
  region: ${param:region}

  httpApi:
    id: ${param:apiGatewayId, ""}  # vazio no local = serverless-offline cuida
    authorizers:
      # cognitoAuthorizer:
      #   type: jwt
      #   identitySource: $request.header.Authorization
      #   issuerUrl: https://cognito-idp.sa-east-1.amazonaws.com/sa-east-1_2DDuPPtc0
      #   audience:
      #     - 76hul7797npfkmpoju0mbghti7

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:sa-east-1:138413505977:table/coaches
            - arn:aws:dynamodb:sa-east-1:138413505977:table/student
            - arn:aws:dynamodb:sa-east-1:138413505977:table/gyms

functions:

  gymGet:
    handler: src/gyms/get-handler.handler
    environment:
      STAGE: ${param:stage}
      REGION: ${param:region}
      ENDPOINT: ${param:endpoint, ""}
      ACCESS_KEY_ID: ${param:access_key_id, ""}
      SECRET_ACCESS_KEY: ${param:secret_access, ""}
    events:
      - httpApi:
          path: /gyms
          method: GET
          # authorizer:
          #   name: cognitoAuthorizer

  # C:\Users\João\Desktop\teste\CoachMatch\server\coachmatch\src\gyms\get-handler.js
  gymSuggest:
    handler: src/gyms/suggest-handler.handler
    environment:
      STAGE: ${param:stage}
      REGION: ${param:region}
      ENDPOINT: ${param:endpoint, ""}
      ACCESS_KEY_ID: ${param:access_key_id, ""}
      SECRET_ACCESS_KEY: ${param:secret_access, ""}
    events:
      - httpApi:
          path: /gyms/suggest
          method: POST
          # authorizer:
          #   name: cognitoAuthorizer

  coachGetMe:
    handler: src/coaches/get-handler.handler
    environment:
      STAGE: ${param:stage}
      REGION: ${param:region}
      ENDPOINT: ${param:endpoint, ""}
      ACCESS_KEY_ID: ${param:access_key_id, ""}
      SECRET_ACCESS_KEY: ${param:secret_access, ""}
    events:
      - httpApi:
          path: /coach/me
          method: GET
          # authorizer:
          #   name: cognitoAuthorizer

  coachUpdateMe:
    handler: src/coaches/update-handler.handler
    environment:
      STAGE: ${param:stage}
      REGION: ${param:region}
      ENDPOINT: ${param:endpoint, ""}
      ACCESS_KEY_ID: ${param:access_key_id, ""}
      SECRET_ACCESS_KEY: ${param:secret_access, ""}
    events:
      - httpApi:
          path: /coach/me
          method: PUT
          # authorizer:
          #   name: cognitoAuthorizer

  
  coachCreate:
    handler: src/coaches/handler.handler
    environment:
      STAGE: ${param:stage}
      REGION: ${param:region}
      ENDPOINT: ${param:endpoint, ""}
      ACCESS_KEY_ID: ${param:access_key_id, ""}
      SECRET_ACCESS_KEY: ${param:secret_access, ""}
    events:
      - cognitoUserPool:
          pool: CoachAccess
          trigger: PostConfirmation
          existing: true

  studentCreate:
    handler: src/students/create-student/handler.handler
    environment:
      STAGE: ${param:stage}
      REGION: ${param:region}
      ENDPOINT: ${param:endpoint, ""}
      ACCESS_KEY_ID: ${param:access_key_id, ""}
      SECRET_ACCESS_KEY: ${param:secret_access, ""}
    events:
      - cognitoUserPool:
          pool: StudentAccess
          trigger: PostConfirmation
          existing: true

  studentGetProfile:
    handler: src/students/get-student/handler.handler
    environment:
      STAGE: ${param:stage}
      REGION: ${param:region}
      ENDPOINT: ${param:endpoint, ""}
      ACCESS_KEY_ID: ${param:access_key_id, ""}
      SECRET_ACCESS_KEY: ${param:secret_access, ""}
    events:
      - httpApi:
          path: /student/me
          method: GET
          # authorizer:
          #   name: cognitoAuthorizer

  studentUpdateProfile:
    handler: src/students/update-student-profile/handler.handler
    environment:
      STAGE: ${param:stage}
      REGION: ${param:region}
      ENDPOINT: ${param:endpoint, ""}
      ACCESS_KEY_ID: ${param:access_key_id, ""}
      SECRET_ACCESS_KEY: ${param:secret_access, ""}
    events:
      - httpApi:
          path: /student/me/profile
          method: POST
          # authorizer:
          #   name: cognitoAuthorizer

  studentUpdateHealth:
    handler: src/students/update-student-health/handler.handler
    environment:
      STAGE: ${param:stage}
      REGION: ${param:region}
      ENDPOINT: ${param:endpoint, ""}
      ACCESS_KEY_ID: ${param:access_key_id, ""}
      SECRET_ACCESS_KEY: ${param:secret_access, ""}
    events:
      - httpApi:
          path: /student/me/health
          method: POST
          # authorizer:
          #   name: cognitoAuthorizer

resources:
  Conditions:
    IsLocal: !Equals [ "${param:stage}", "local" ]
  Resources:
    gymsTable:
      Type: AWS::DynamoDB::Table
      Condition: IsLocal
      Properties:
        TableName: gyms
        AttributeDefinitions:
          - AttributeName: gymId
            AttributeType: S
        KeySchema:
          - AttributeName: gymId
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
    usersTable:
      Type: AWS::DynamoDB::Table
      Condition: IsLocal
      Properties:
        TableName: coaches
        AttributeDefinitions:
          - AttributeName: coachId
            AttributeType: S
        KeySchema:
          - AttributeName: coachId
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
    studentTable:
      Type: AWS::DynamoDB::Table
      Condition: IsLocal
      Properties:
        TableName: student
        AttributeDefinitions:
          - AttributeName: studentId
            AttributeType: S
        KeySchema:
          - AttributeName: studentId
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1

custom:
  config: ${file(./config.yml)}
  dynamodb:
    stages:
      - local
    start:
      port: 8000
      inMemory: true
      migrate: true
  serverless-offline:
    ignoreJWTSignature: true
  esbuild:
    bundle: true
    minify: false
    sourcemap: false
    exclude:
      - aws-sdk
    target: node18
    platform: node