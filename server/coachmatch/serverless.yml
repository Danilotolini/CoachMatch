          authorizer: ${self:custom.coachAuthorizer.${sls:stage}}
      - httpApi:
          path: /student/chat/messages/{id}
          method: PATCH
          authorizer: ${self:custom.studentAuthorizer.${sls:stage}}

  chatMessageDelete:
    environment:
      STAGE: ${param:stage}
      REGION: ${param:region}
      ENDPOINT: ${param:endpoint, ""}
      ACCESS_KEY_ID: ${param:access_key_id, ""}
      SECRET_ACCESS_KEY: ${param:secret_access, ""}
      STREAM_API_KEY: ${param:apiKey, ""}
      STREAM_API_SECRET: ${param:apiSecret, ""}
    handler: src/api-chat/messages.remove
    events:
      - httpApi:
          path: /coach/chat/messages/{id}
          method: DELETE
          authorizer: ${self:custom.coachAuthorizer.${sls:stage}}
      - httpApi:
          path: /student/chat/messages/{id}
          method: DELETE
          authorizer: ${self:custom.studentAuthorizer.${sls:stage}}


  # ─── Integração Pagamento → Agendamento ─────────────────────────────────────
  # Consome `payment.succeeded` e marca o schedule como PAID. Ver PLAN.md.

  onPaymentSucceeded:
    handler: src/schedule/on-payment-succeeded/handler.handler
    environment:
      STAGE: ${param:stage}
      REGION: ${param:region}
      ENDPOINT: ${param:endpoint, ""}
      ACCESS_KEY_ID: ${param:access_key_id, ""}
      SECRET_ACCESS_KEY: ${param:secret_access, ""}
    events:
      - sqs:
          arn: !GetAtt PaymentSucceededQueue.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

resources:
  Conditions:
    IsLocal: !Equals [ "${param:stage}", "local" ]
  Resources:
    gymsTable:
      Type: AWS::DynamoDB::Table
      Condition: IsLocal
      Properties:
        TableName: gyms
        AttributeDefinitions:
          - AttributeName: gymId
            AttributeType: S
        KeySchema:
          - AttributeName: gymId
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
    usersTable:
      Type: AWS::DynamoDB::Table
      Condition: IsLocal
      Properties:
        TableName: coaches
        AttributeDefinitions:
          - AttributeName: coachId
            AttributeType: S
          - AttributeName: status
            AttributeType: S
        KeySchema:
          - AttributeName: coachId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: status-coachId-index
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: coachId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 1
              WriteCapacityUnits: 1
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
    studentTable:
      Type: AWS::DynamoDB::Table
      Condition: IsLocal
      Properties:
        TableName: student
        AttributeDefinitions:
          - AttributeName: studentId
            AttributeType: S
        KeySchema:
          - AttributeName: studentId
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1

    paymentsTable:
      Type: AWS::DynamoDB::Table
      Condition: IsLocal
      Properties:
        TableName: payments
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
          - AttributeName: GSI2PK
            AttributeType: S
          - AttributeName: GSI2SK
            AttributeType: S
          - AttributeName: GSI3PK
            AttributeType: S
          - AttributeName: GSI3SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 1
              WriteCapacityUnits: 1
          - IndexName: GSI2
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH
              - AttributeName: GSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 1
              WriteCapacityUnits: 1
          - IndexName: GSI3
            KeySchema:
              - AttributeName: GSI3PK
                KeyType: HASH
              - AttributeName: GSI3SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 1
              WriteCapacityUnits: 1
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1

    # Fila do evento payment.succeeded (gerenciada pelo stack, todos os stages)
    PaymentSucceededQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: payment-succeeded-${param:stage}
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt PaymentSucceededDLQ.Arn
          maxReceiveCount: 3
    PaymentSucceededDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: payment-succeeded-dlq-${param:stage}
        MessageRetentionPeriod: 1209600

