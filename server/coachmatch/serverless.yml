  chatMessageDelete:
    environment:
      STAGE: ${param:stage}
      REGION: ${param:region}
      ENDPOINT: ${param:endpoint, ""}
      ACCESS_KEY_ID: ${param:access_key_id, ""}
      SECRET_ACCESS_KEY: ${param:secret_access, ""}
      STREAM_API_KEY: ${param:apiKey, ""}
      STREAM_API_SECRET: ${param:apiSecret, ""}
    handler: src/api-chat/messages.remove
    events:
      - httpApi:
          path: /coach/chat/messages/{id}
          method: DELETE
          authorizer:
            name: coachAuthorizer
      - httpApi:
          path: /student/chat/messages/{id}
          method: DELETE
          authorizer:
            name: studentAuthorizer


  # ─── Integração Pagamento → Agendamento ─────────────────────────────────────
  # Consome `payment.succeeded` e marca o schedule como PAID. Ver PLAN.md.

  onPaymentSucceeded:
    handler: src/schedule/on-payment-succeeded/handler.handler
    environment:
