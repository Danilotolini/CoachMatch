  #     SECRET_ACCESS_KEY: ${param:secret_access, ""}
  #   events:
  #     # NOTA: esta rota NÃO existe no API Gateway, o coach é cadastrado como ativo.
  #     - httpApi:
  #         path: /coach/me/submit-for-review
  #         method: POST
  #         authorizer:
  #           name: coachAuthorizer

