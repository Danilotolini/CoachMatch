name: CI/CD Pipeline - Full Stack

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de deploy'
        required: true
        type: choice
        options:
          - develop
          - production
      confirm:
        description: 'Digite CONFIRMAR para prosseguir'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  # ── 1. LINT & TYPE-CHECK ────────────────────────────────────────────────────
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: TypeScript type check
        run: pnpm run type-check

  # ── 2. SECURITY ─────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm audit covers all workspace packages declared at root level
      - name: Audit root workspace dependencies
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

  # ── 3. BACKEND TESTS ────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install root workspace dependencies
        run: pnpm install --frozen-lockfile

      # server/coachmatch é uma workspace pnpm aninhada — instalar separadamente
      - name: Install coachmatch dependencies
        run: cd server/coachmatch && pnpm install --frozen-lockfile

      # Vitest — todas as Lambdas (coaches, students, gyms, payments)
      - name: Test coachmatch lambdas (Vitest)
        run: cd server/coachmatch && pnpm run test:coverage
        env:
          STAGE: test
          REGION: us-east-1

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./server/coachmatch/coverage/coverage-final.json
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # ── 4. FRONTEND TESTS ───────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests with coverage
        run: pnpm run test:frontend

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./client/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  # ── 5. BUILD ────────────────────────────────────────────────────────────────
  build:
    name: Build Check
    needs: [lint, test-backend, test-frontend]
    runs-on: ubuntu-latest
    # Run even if earlier jobs are skipped (e.g. draft PR)
    if: always()
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the React SPA.
      # Cognito vars usam secrets quando disponíveis (deploy real) e placeholders
      # quando ausentes (CI de validação — build check, não deploy).
      - name: Build frontend
        run: cd client && pnpm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.coachmatch.com.br' }}
          VITE_API_MOCKING: disabled
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID || 'ci-coach-client-id' }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN || 'https://login.coachmatch.com.br' }}
          VITE_COGNITO_STUDENT_CLIENT_ID: ${{ secrets.VITE_COGNITO_STUDENT_CLIENT_ID || 'ci-student-client-id' }}
          VITE_COGNITO_STUDENT_DOMAIN: ${{ secrets.VITE_COGNITO_STUDENT_DOMAIN || 'https://student.coachmatch.com.br' }}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: client-build
          path: client/dist
          retention-days: 7

  # ── 6. E2E ──────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npx playwright test --reporter=html
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 5

  # ── 7. QUALITY GATE ─────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    needs: [lint, test-backend, test-frontend, build, security]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Summarize job results
        run: |
          echo "### Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.test-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.test-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if build, tests or lint broke
        if: |
          needs.lint.result == 'failure' ||
          needs.build.result == 'failure' ||
          needs.test-backend.result == 'failure' ||
          needs.test-frontend.result == 'failure'
        run: |
          echo "❌ Pipeline bloqueado por falha em um ou mais jobs críticos." >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: All checks passed
        run: echo "✅ Pipeline passou por todos os quality gates"

  # ── 8. DEPLOY (manual, via workflow_dispatch) ────────────────────────────────
  deploy:
    name: Deploy Manual
    needs: quality-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'CONFIRMAR'
    permissions:
      contents: read
      deployments: write

    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "CONFIRMAR" ]; then
            echo "Confirmacao invalida. Deploy cancelado."
            exit 1
          fi

      - uses: actions/checkout@v4

      # v4 is the current LTS — v2 is deprecated and will stop working
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - uses: actions/download-artifact@v4
        with:
          name: client-build
          path: client/dist

      - name: Deploy para develop (staging)
        if: github.event.inputs.environment == 'develop'
        run: |
          aws s3 sync client/dist s3://${{ secrets.S3_BUCKET_DEVELOP }}/ --delete
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DEVELOP_ID }} \
            --paths "/*"
          echo "✅ Deploy realizado em develop (staging)" >> $GITHUB_STEP_SUMMARY

      - name: Deploy para production
        if: github.event.inputs.environment == 'production' && github.ref == 'refs/heads/main'
        run: |
          aws s3 sync client/dist s3://${{ secrets.S3_BUCKET_PRODUCTION }}/ --delete
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_PRODUCTION_ID }} \
            --paths "/*"
          echo "✅ Deploy realizado em production" >> $GITHUB_STEP_SUMMARY

      - name: Block production deploy from non-main branch
        if: github.event.inputs.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "❌ Deploy de production só é permitido a partir da branch main."
          exit 1
