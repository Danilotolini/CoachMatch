name: Dependency and Security Updates

on:
  schedule:
    - cron: '0 9 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Check and Update Dependencies
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: Client
            path: client
          - name: Server
            path: server

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: cd ${{ matrix.path }} && pnpm install --frozen-lockfile

      - name: Check for updates
        id: updates
        run: |
          cd ${{ matrix.path }}
          pnpm outdated --format json > outdated.json 2>/dev/null || echo "No updates found"
          echo "status=checked" >> $GITHUB_OUTPUT

      - name: Security audit
        continue-on-error: true
        run: |
          cd ${{ matrix.path }}
          pnpm audit --audit-level=moderate || true

      - name: Generate update summary
        if: always()
        run: |
          echo "## ${{ matrix.name }} Dependencies Status" >> $GITHUB_STEP_SUMMARY
          echo "Checked for outdated packages" >> $GITHUB_STEP_SUMMARY
          echo "Security audit completed" >> $GITHUB_STEP_SUMMARY

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: Generate audit report
        run: pnpm audit --json > audit-report.json 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: audit-report.json
          retention-days: 30

  create-update-pr:
    name: Create Update PR
    needs: [update-dependencies, security-audit]
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Update all packages
        run: |
          pnpm install --frozen-lockfile
          cd client && pnpm update
          cd ../server && pnpm update

      - name: Run tests to verify updates
        continue-on-error: true
        run: pnpm run test 2>/dev/null || echo "Tests skipped"

      - uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): atualizacao semanal de dependencias'
          title: 'Chore: Atualizacao semanal de dependencias'
          body: |
            ## Atualizacao Automatica de Dependencias

            Este PR contem atualizacoes semanais de dependencias.

            ### O que esta incluido:
            - Patches de seguranca
            - Atualizacoes de versoes menores
            - Correcoes de bugs

            ### Checklist:
            - [ ] Executar suite completa de testes
            - [ ] Verificar ausencia de breaking changes
            - [ ] Checar compatibilidade

            _Automatizado pelo GitHub Actions_
          branch: chore/update-dependencies
          delete-branch: true
          labels: |
            dependencies
            automated
          assignees: |
            ${{ github.repository_owner }}