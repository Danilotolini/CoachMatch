name: Auto PR

on:
  push:
    branches:
      - 'feat/**'
      - develop
      - 'release/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    name: Abrir PR automático
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # feat/* → develop
      - name: PR feat → develop
        if: startsWith(github.ref, 'refs/heads/feat/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          TITLE="$(echo "$BRANCH" | sed 's|feat/||')"

          EXISTING=$(gh pr list --head "$BRANCH" --base develop --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh pr create \
              --title "$TITLE" \
              --body "PR automático de \`$BRANCH\` para \`develop\`." \
              --base develop \
              --head "$BRANCH" \
              --draft
            echo "PR criado: $BRANCH → develop"
          else
            echo "PR já existe para $BRANCH → develop, pulando."
          fi

      # develop → cria release/vX.X.X com versão incrementada automaticamente
      - name: Criar release branch e PR → main
        if: github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags

          # Pega a última tag ou começa em v0.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          MAJOR=$(echo "$LATEST_TAG" | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST_TAG" | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST_TAG" | sed 's/v//' | cut -d. -f3)
          NEW_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          RELEASE_BRANCH="release/$NEW_VERSION"

          echo "Última versão: $LATEST_TAG → Nova: $NEW_VERSION"

          # Cria a release branch a partir do HEAD do develop se não existe
          if ! git ls-remote --exit-code origin "refs/heads/$RELEASE_BRANCH"; then
            git checkout -b "$RELEASE_BRANCH"
            git push origin "$RELEASE_BRANCH"
            echo "Branch $RELEASE_BRANCH criada."
          else
            echo "Branch $RELEASE_BRANCH já existe."
          fi

          # Abre PR da release para main
          EXISTING=$(gh pr list --head "$RELEASE_BRANCH" --base main --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh pr create \
              --title "release $NEW_VERSION" \
              --body "Release automática $NEW_VERSION a partir de \`develop\`." \
              --base main \
              --head "$RELEASE_BRANCH" \
              --draft
            echo "PR criado: $RELEASE_BRANCH → main"
          else
            echo "PR já existe para $RELEASE_BRANCH → main, pulando."
          fi

      # release/* → main (para fixes manuais feitos direto na release)
      - name: PR release → main
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          TITLE="release: $(echo "$BRANCH" | sed 's|release/||')"

          EXISTING=$(gh pr list --head "$BRANCH" --base main --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh pr create \
              --title "$TITLE" \
              --body "PR automático de \`$BRANCH\` para \`main\`." \
              --base main \
              --head "$BRANCH" \
              --draft
            echo "PR criado: $BRANCH → main"
          else
            echo "PR já existe para $BRANCH → main, pulando."
          fi
