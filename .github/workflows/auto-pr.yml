name: Auto PR

on:
  push:
    branches:
      - 'feat/**'
      - develop
      - 'release/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    name: Abrir PR automático
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # feat/* → develop
      - name: PR feat → develop
        if: startsWith(github.ref, 'refs/heads/feat/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          TITLE="$(echo "$BRANCH" | sed 's|feat/||')"

          EXISTING=$(gh pr list --head "$BRANCH" --base develop --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh pr create \
              --title "$TITLE" \
              --body "PR automático de \`$BRANCH\` para \`develop\`." \
              --base develop \
              --head "$BRANCH" \
              --draft
            echo "PR criado: $BRANCH → develop"
          else
            echo "PR já existe para $BRANCH → develop, pulando."
          fi

      # develop → release/*
      - name: PR develop → release
        if: github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_BRANCH="release/$(date +%Y-%m-%d)"

          git fetch origin
          if ! git ls-remote --exit-code origin "refs/heads/$RELEASE_BRANCH"; then
            git checkout -b "$RELEASE_BRANCH"
            git push origin "$RELEASE_BRANCH"
          fi

          EXISTING=$(gh pr list --head develop --base "$RELEASE_BRANCH" --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh pr create \
              --title "release: $(date +%Y-%m-%d)" \
              --body "PR automático de \`develop\` para \`$RELEASE_BRANCH\`." \
              --base "$RELEASE_BRANCH" \
              --head develop \
              --draft
            echo "PR criado: develop → $RELEASE_BRANCH"
          else
            echo "PR já existe para develop → $RELEASE_BRANCH, pulando."
          fi

      # release/* → main
      - name: PR release → main
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          TITLE="release: $(echo "$BRANCH" | sed 's|release/||')"

          EXISTING=$(gh pr list --head "$BRANCH" --base main --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh pr create \
              --title "$TITLE" \
              --body "PR automático de \`$BRANCH\` para \`main\`." \
              --base main \
              --head "$BRANCH" \
              --draft
            echo "PR criado: $BRANCH → main"
          else
            echo "PR já existe para $BRANCH → main, pulando."
          fi
