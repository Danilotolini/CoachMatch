name: Auto PR

on:
  push:
    branches:
      - 'feat/**'
      - 'release/**'
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão da release (ex: v1.0.0, v1.2.3)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    name: Abrir PR automático
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # feat/* → develop
      - name: PR feat → develop
        if: startsWith(github.ref, 'refs/heads/feat/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          TITLE="$(echo "$BRANCH" | sed 's|feat/||')"

          EXISTING=$(gh pr list --head "$BRANCH" --base develop --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh pr create \
              --title "$TITLE" \
              --body "PR automático de \`$BRANCH\` para \`develop\`." \
              --base develop \
              --head "$BRANCH" \
              --draft
            echo "PR criado: $BRANCH → develop"
          else
            echo "PR já existe para $BRANCH → develop, pulando."
          fi

      # workflow_dispatch → cria release a partir do develop e abre PR release → main
      - name: Criar release branch e PR → main (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_BRANCH="release/${{ github.event.inputs.versao }}"

          git fetch origin

          if ! git ls-remote --exit-code origin "refs/heads/$RELEASE_BRANCH"; then
            git checkout -b "$RELEASE_BRANCH" origin/develop
            git push origin "$RELEASE_BRANCH"
            echo "Branch $RELEASE_BRANCH criada a partir de develop."
          else
            echo "Branch $RELEASE_BRANCH já existe."
          fi

          EXISTING=$(gh pr list --head "$RELEASE_BRANCH" --base main --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh pr create \
              --title "release ${{ github.event.inputs.versao }}" \
              --body "PR de \`$RELEASE_BRANCH\` para \`main\`. Versão: ${{ github.event.inputs.versao }}" \
              --base main \
              --head "$RELEASE_BRANCH" \
              --draft
            echo "PR criado: $RELEASE_BRANCH → main"
          else
            echo "PR já existe para $RELEASE_BRANCH → main, pulando."
          fi

      # release/* → main (para fixes manuais feitos direto na release)
      - name: PR release → main
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          TITLE="release: $(echo "$BRANCH" | sed 's|release/||')"

          EXISTING=$(gh pr list --head "$BRANCH" --base main --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh pr create \
              --title "$TITLE" \
              --body "PR automático de \`$BRANCH\` para \`main\`." \
              --base main \
              --head "$BRANCH" \
              --draft
            echo "PR criado: $BRANCH → main"
          else
            echo "PR já existe para $BRANCH → main, pulando."
          fi
